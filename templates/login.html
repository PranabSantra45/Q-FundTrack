{% extends "base.html" %}

{% block title %}Sign In - Q-FundTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
                <i class="bi bi-shield-lock-fill fs-2 text-primary"></i>
                <h4 class="fw-bold mb-1 mt-2">Organization Sign In</h4>
                <p class="text-muted small mb-0">Enter your credentials to access your organization portal</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus id="id_username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required id="id_password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                    </button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <p class="text-muted small mb-2">Represent a new charitable organization?</p>
                    <a href="{% url 'register_org' %}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-building-add me-1"></i> Register New Organization
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
